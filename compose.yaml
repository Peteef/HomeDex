services:
  homedex:
    # The server pulls the published image; development builds it with `docker compose up --build`.
    # HOMEDEX_VERSION (in .env, for example 1.2.3) pins a release; without it, latest from master.
    image: ghcr.io/peteef/homedex:${HOMEDEX_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    # These win over .env, so a copy of .env.example (DATA_DIR=./data) cannot move the database
    # out of the volume or the server off the mapped port.
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      # The container runs as uid 1000. On a Linux host, ./data must be writable by that uid.
      - ./data:/data
