version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['release:patch']
    commit-message:
      prefix: '[Dependabot]'
    groups:
      # react-i18next majors require the matching i18next major, so neither can be bumped alone.
      # Listed first because a dependency joins the first group that matches it.
      i18next:
        patterns: ['i18next', 'react-i18next']
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Its version must equal the Playwright image in ci.yml, so both are bumped by hand.
      - dependency-name: '@playwright/test'
      # Blocked until typescript-eslint and eslint-plugin-jsx-a11y support the next majors.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Follows the Node.js version in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['release:patch']
    commit-message:
      prefix: '[Dependabot]'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: '[Dependabot]'
    ignore:
      # Follows the Node.js version in .nvmrc.
      - dependency-name: node
        update-types: ['version-update:semver-major']
