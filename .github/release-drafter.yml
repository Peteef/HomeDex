# Used by the `release` job in ci.yml. The categories match the release:* labels that set the
# version bump of a merge (the highest one wins). Minor and major bumps publish a GitHub Release
# with every pull request since the last one; patch bumps only update the "Next release" draft.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'
no-changes-template: '- No pull requests'
template: |
  ## What's changed

  $CHANGES

categories:
  - type: version-resolver
    semver-increment: major
    when:
      label: 'release:major'
  - type: version-resolver
    semver-increment: minor
    when:
      label: 'release:minor'

# Run only when a pull request opens (release-labels.yml), so a label changed by hand stays.
# release:major is never added automatically.
autolabeler:
  - labels: ['release:minor']
    branch:
      - '/^epic\/.+/'
  - labels: ['release:patch']
    fallback: true
