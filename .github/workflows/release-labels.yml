name: Release labels

# Every pull request into master carries one release:* label, which sets its version bump
# (docs/releases.md). Dependabot sets its own (dependabot.yml) and gets a read-only token.
on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # `gh pr create --label` adds its label after the pull request opens, so the labels are read
  # fresh instead of from the event: a label added here starts no run of one-label to remove it.
  default-label:
    name: default-label
    if: >-
      contains(fromJSON('["opened", "reopened"]'), github.event.action) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = { ...context.repo, issue_number: context.issue.number };
            const { data: labels } = await github.rest.issues.listLabelsOnIssue(issue);

            if (labels.some(({ name }) => name.startsWith('release:'))) {
              core.info('The pull request already has a release label.');
              return;
            }

            const epic = /^epic\/.+/.test(context.payload.pull_request.head.ref);
            await github.rest.issues.addLabels({ ...issue, labels: [epic ? 'release:minor' : 'release:patch'] });

  # Adding a release label replaces the other ones, so choosing a bump is a single click.
  one-label:
    name: one-label
    if: >-
      github.event.action == 'labeled' &&
      startsWith(github.event.label.name, 'release:') &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const added = context.payload.label.name;
            const others = context.payload.pull_request.labels
              .map(({ name }) => name)
              .filter((name) => name.startsWith('release:') && name !== added);

            for (const name of others) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name });
            }

  # A minor or major pull request opens a GitHub Release with its Release notes, so it cannot be
  # merged without them. Also fails when two release labels are left. Runs on every change to the
  # labels or the description, after the label jobs, whose changes start no new run, so the labels
  # are read fresh.
  release-notes:
    name: release-notes
    needs: [default-label, one-label]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels" --jq '[.[].name]')
          node scripts/check-release-notes.ts "$labels" "$BODY"
