name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/peteef/homedex
  # setup-qemu-action pulls binfmt:latest unless told otherwise. Dependabot cannot update this
  # pin, so it is bumped by hand, like the Playwright image.
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

# A pull request cancels its outdated runs. Every merge to master gets a run of its own that nothing
# cancels or replaces, so every merge is tested and published under its own version.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image ships the browsers and their system packages, so the job needs no
    # Ubuntu mirror. Its version must equal @playwright/test in package.json: bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The image has no compiler. better-sqlite3 ships prebuilt binaries, so its compile step is
      # skipped, as in the Dockerfile.
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # `context: .` builds the checked-out folder like a local build. Without it the action
      # builds from a Git URL, where .dockerignore is not applied the same way.
      # A multi-platform build cannot be loaded into the local engine, so the runner's own
      # architecture is built and loaded first for the smoke test.
      - name: Build amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: homedex:ci
          cache-from: type=gha
      - run: tests/docker/smoke.sh homedex:ci
      # Fills the cache the publish jobs push from, so they push the smoke-tested amd64 layers. Only
      # the built UI differs, by the APP_VERSION it is given.
      - name: Build amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every merge to master gets a version: the version of the merge before it, bumped by its pull
  # request's release:* label (scripts/next-version.ts). Runs of several merges can overlap, so each
  # run versions every merge since the last version tag, and all runs agree on every version.
  version:
    name: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
      merges: ${{ steps.next.outputs.merges }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # The last tag is looked up from the parent, so a re-run gets the same versions after this
      # merge is tagged. Before the first tag, versions start with the merge that added versioning.
      # A merge's pull request is the one merged as that commit: an open epic/ pull request that
      # merged master also lists it.
      - id: merges
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git tag --list 'v[0-9]*' --merged HEAD^ --sort=-v:refname | sed -n 1p)
          first=$(git log --format=%H --diff-filter=A -- scripts/next-version.ts | tail -n 1)
          {
            echo "last=$last"
            echo -n 'merges='
            git log --first-parent --reverse --format=%H "${last:-$first^}..$GITHUB_SHA" |
              while read -r sha; do
                gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                  --jq "{sha: \"$sha\", labels: [.[] | select(.merge_commit_sha == \"$sha\") | .labels[].name]}"
              done |
              jq -sc .
          } >> "$GITHUB_OUTPUT"
      - id: next
        env:
          LAST_TAG: ${{ steps.merges.outputs.last }}
          MERGES: ${{ steps.merges.outputs.merges }}
        run: node scripts/next-version.ts "$LAST_TAG" "$MERGES" >> "$GITHUB_OUTPUT"

  # Tags the merges and publishes the GitHub Release of a minor or major one, listing every pull
  # request since the last release; patches gather meanwhile in a "Next release" draft
  # (.github/release-drafter.yml). One run at a time, but GitHub keeps only one waiting run per
  # group and a newer one replaces it, so each run also catches up on what a replaced one left.
  release:
    name: release
    needs: [version, verify, e2e, secrets, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only the newest minor or major merge of a catch-up gets a release; an older one's notes join
      # it. A run that finishes after a newer merge was tagged leaves the draft to the newer run.
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGES: ${{ needs.version.outputs.merges }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          jq -r '.[] | "\(.sha) v\(.version)"' <<< "$MERGES" |
            while read -r sha tag; do
              if ! git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
                git tag "$tag" "$sha"
                git push origin "$tag"
              elif [ "$(git rev-list -n 1 "$tag")" != "$sha" ]; then
                echo "::error::$tag already exists on another commit"
                exit 1
              fi
            done

          release=$(jq -r 'map(select(.release)) | last | select(.) | "\(.sha) \(.version)"' <<< "$MERGES")

          if [ -n "$release" ] && ! gh release view "v${release#* }" > /dev/null 2>&1; then
            echo "release_sha=${release% *}" >> "$GITHUB_OUTPUT"
            echo "release_version=${release#* }" >> "$GITHUB_OUTPUT"
          fi

          newest=$(git tag --list 'v[0-9]*' --sort=-v:refname | sed -n 1p)

          if [ "$newest" = "v$VERSION" ] && [ "$RELEASE" != true ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
      - id: highlights
        if: steps.plan.outputs.release_sha
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: release-highlights.yml
          dry-run: true
          commitish: ${{ steps.plan.outputs.release_sha }}
      - if: steps.plan.outputs.release_sha
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          version: ${{ steps.plan.outputs.release_version }}
          commitish: ${{ steps.plan.outputs.release_sha }}
          publish: true
          # Trimmed by release-drafter, so the template in release-drafter.yml adds the blank line.
          header: ${{ steps.highlights.outputs.body }}
      - if: steps.plan.outputs.draft
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          version: ${{ needs.version.outputs.version }}
          # The commit this run tested, not the branch head, which may already be a newer merge.
          commitish: ${{ github.sha }}
          name: Next release

  publish:
    name: publish
    needs: [version, verify, e2e, secrets, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha

  # latest follows master: a run moves it only while its merge is still the newest one, so a slower
  # run of an older merge never moves it back. When the newest merge fails on master, latest waits
  # for the next merge that passes.
  latest:
    name: latest
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - id: master
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" >> "$GITHUB_OUTPUT"
      - if: steps.master.outputs.sha == github.sha
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.master.outputs.sha == github.sha
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"

  # Pull request images are previews, tagged pr-<number> and deleted when the pull request
  # closes (cleanup-preview.yml). Pull requests from forks and Dependabot get a read-only token.
  publish-preview:
    name: publish-preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=ref,event=pr
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
