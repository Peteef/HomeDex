name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/peteef/homedex

# A pull request cancels its outdated runs. Master runs queue instead, so merges are versioned in
# order. GitHub keeps one queued run per group: a newer merge replaces a queued one, and its version
# then covers both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image ships the browsers and their system packages, so the job needs no
    # Ubuntu mirror. Its version must equal @playwright/test in package.json: bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The image has no compiler. better-sqlite3 ships prebuilt binaries, so its compile step is
      # skipped, as in the Dockerfile.
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # `context: .` builds the checked-out folder like a local build. Without it the action
      # builds from a Git URL, where .dockerignore is not applied the same way.
      # A multi-platform build cannot be loaded into the local engine, so the runner's own
      # architecture is built and loaded first for the smoke test.
      - name: Build amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: homedex:ci
          cache-from: type=gha
      - run: tests/docker/smoke.sh homedex:ci
      # Fills the cache the publish jobs push from, so they push the smoke-tested amd64 layers. Only
      # the built UI differs, by the APP_VERSION it is given.
      - name: Build amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every merge to master gets a version: the last v<version> tag bumped by the release:* labels of
  # the pull requests merged since it, tagged on the merge. Minor and major bumps also publish a
  # GitHub Release listing every pull request since the last one; until then, they gather in a
  # "Next release" draft (.github/release-drafter.yml).
  release:
    name: release
    if: github.event_name == 'push'
    needs: [verify, e2e, secrets, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Looked up from the parent, so a re-run finds the same tag even after this merge is tagged.
      - id: last
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)" >> "$GITHUB_OUTPUT"
      - id: changes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          dry-run: true
          from: refs/tags/${{ steps.last.outputs.tag }}
          commitish: ${{ github.sha }}
      - id: next
        env:
          LAST_TAG: ${{ steps.last.outputs.tag }}
          LABELS: ${{ steps.changes.outputs.labels }}
        run: node scripts/next-version.ts "$LAST_TAG" "$LABELS" >> "$GITHUB_OUTPUT"
      - env:
          TAG: v${{ steps.next.outputs.version }}
        run: |
          if ! git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
      - id: highlights
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-highlights.yml
          dry-run: true
          commitish: ${{ github.sha }}
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          version: ${{ steps.next.outputs.version }}
          # The commit this run tested, not the branch head, which may already be a newer merge.
          commitish: ${{ github.sha }}
          publish: ${{ steps.next.outputs.release }}
          name: ${{ steps.next.outputs.release != 'true' && 'Next release' || '' }}
          header: "${{ steps.highlights.outputs.body }}\n\n"

  publish:
    name: publish
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha

  # Pull request images are previews, tagged pr-<number> and deleted when the pull request
  # closes (cleanup-preview.yml). Pull requests from forks and Dependabot get a read-only token.
  publish-preview:
    name: publish-preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=ref,event=pr
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
